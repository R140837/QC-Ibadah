<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#176b4d" />
  <title>Dashboard QC</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="appShell" class="app-shell hidden">
    <aside class="sidebar">
      <div>
        <div class="side-brand">
          <div class="brand-mark small">AW7</div>
          <div>
            <strong>QC Ibadah</strong>
            <span>& Akhlak</span>
          </div>
        </div>
        <nav id="navMenu" class="nav-menu"></nav>
      </div>
      <button id="logoutBtn" class="btn btn-ghost">Keluar</button>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="roleLabel">-</p>
          <h2 id="pageTitle">Dashboard</h2>
        </div>
        <div class="user-chip">
          <div class="avatar" id="avatar">U</div>
          <div>
            <strong id="userName">-</strong>
            <span id="userMeta">-</span>
          </div>
        </div>
      </header>

      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="loadingScreen" class="loading-screen">
    <div class="spinner"></div>
    <p>Memuat data QC...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
