<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#176b4d" />
  <title>QC Ibadah & Akhlak</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <div class="brand-mark">AW7</div>
      <p class="eyebrow">AL-WILDAN ISLAMIC SCHOOL 7 SERANG</p>
      <h1>QC Ibadah & Akhlak</h1>
      <p class="muted">Silakan masuk menggunakan akun yang telah diberikan sekolah.</p>

      <form id="loginForm" class="form-stack">
        <label>
          Email / Username
          <input id="email" type="text" autocomplete="username" required placeholder="contoh: 262707001" />
        </label>
        <label>
          Password
          <div class="password-wrap">
            <input id="password" type="password" autocomplete="current-password" required placeholder="Password" />
            <button class="text-btn" type="button" id="togglePassword">Lihat</button>
          </div>
        </label>
        <button class="btn btn-primary" id="loginBtn" type="submit">MASUK</button>
        <p id="loginMessage" class="message"></p>
      </form>

      <p class="login-note">Siswa dapat login menggunakan NIS. Sistem akan mengubahnya menjadi akun internal secara otomatis.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
